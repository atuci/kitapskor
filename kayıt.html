<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üye Ol - KitapSkor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">KitapSkor</div>
        <div class="nav-search">
            <input type="text" placeholder="Kitap, yazar veya ISBN ara...">
            <button>Ara</button>
        </div>
        <div class="nav-links">
            <a href="giris.html">Giriş Yap</a>
            <a href="kayit.html">Üye Ol</a>
        </div>
    </nav>

    <!-- KAYIT FORMU -->
    <div class="auth-container">
        <div class="auth-box">
            <h2>Üye Ol</h2>
            <p class="auth-alt">Zaten üye misin? <a href="giris.html">Giriş Yap</a></p>

            <div class="form-group">
                <label>Ad Soyad</label>
                <input type="text" placeholder="Adınız Soyadınız">
            </div>

            <div class="form-group">
                <label>E-posta</label>
                <input type="email" placeholder="ornek@email.com">
            </div>

            <div class="form-group">
                <label>Şifre</label>
                <input type="password" placeholder="En az 6 karakter">
            </div>

            <div class="form-group">
                <label>Şifre Tekrar</label>
                <input type="password" placeholder="Şifrenizi tekrar girin">
            </div>

            <button class="auth-btn">Üye Ol</button>
        </div>
    </div>

</body>
</html>
