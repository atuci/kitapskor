<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KitapSkor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">KitapSkor</div>
        <div class="nav-search">
            <input type="text" placeholder="Kitap, yazar veya ISBN ara...">
            <button>Ara</button>
        </div>
        <div class="nav-links">
            <a href="giris.html">Giriş Yap</a>
            <a href="kayit.html">Üye Ol</a>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <h1>Türkiye'nin Kitap Platformu</h1>
        <p>Kitapları puanla, incele, okuma listeni oluştur.</p>
        <a href="#" class="btn">Hemen Başla</a>
    </section>
    <!-- KİTAPLAR -->
    <section class="books">
        <h2>Öne Çıkan Kitaplar</h2>
        <div class="book-grid">

            <div class="book-card">
                <a href="kitap.html">
                <img src="https://via.placeholder.com/120x180?text=Kitap" alt="Kitap Kapağı">
                <h3>Devlet Ana</h3>
                </a>
                <p>Kemal Tahir</p>
                <div class="stars">★★★★☆</div>
            </div>

            <div class="book-card">
                <img src="https://covers.openlibrary.org/b/isbn/9789750802799-M.jpg" alt="İnce Memed">
                <h3>İnce Memed</h3>
                <p>Yaşar Kemal</p>
                <div class="stars">★★★★★</div>
            </div>

            <div class="book-card">
                <img src="https://covers.openlibrary.org/b/isbn/9789754700015-M.jpg" alt="Saatleri Ayarlama Enstitüsü">
                <h3>Saatleri Ayarlama Enstitüsü</h3>
                <p>Ahmet Hamdi Tanpınar</p>
                <div class="stars">★★★★☆</div>
            </div>

        </div>
    </section>
</body>
</html>
