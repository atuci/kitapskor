<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - KitapSkor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">KitapSkor</div>
        <div class="nav-search">
            <input type="text" placeholder="Kitap, yazar veya ISBN ara...">
            <button>Ara</button>
        </div>
        <div class="nav-links">
            <a href="giris.html">Giriş Yap</a>
            <a href="kayit.html">Üye Ol</a>
        </div>
    </nav>

    <!-- PROFİL -->
    <div class="profil-container">

        <!-- SOL: PROFİL BİLGİLERİ -->
        <div class="profil-sol">
            <img src="https://via.placeholder.com/150x150?text=Profil" alt="Profil Fotoğrafı" class="profil-foto">
            <h2>Ahmet Yılmaz</h2>
            <p class="profil-sehir">📍 İstanbul</p>
            <p class="profil-tarih">Üyelik: Ocak 2024</p>
            <div class="profil-istatistik">
                <div class="istatistik">
                    <strong>42</strong>
                    <span>Kitap</span>
                </div>
                <div class="istatistik">
                    <strong>38</strong>
                    <span>Puan</span>
                </div>
                <div class="istatistik">
                    <strong>12</strong>
                    <span>Takipçi</span>
                </div>
            </div>
            <button class="profil-duzenle">Profili Düzenle</button>
        </div>

        <!-- SAĞ: KİTAPLAR -->
        <div class="profil-sag">

            <div class="profil-sekme">
                <button class="sekme aktif">Okuduklarım</button>
                <button class="sekme">Okuyorum</button>
                <button class="sekme">Okumak İstiyorum</button>
            </div>

            <div class="profil-kitaplar">

                <div class="profil-kitap">
                    <img src="https://via.placeholder.com/60x90?text=K" alt="Kitap">
                    <div class="profil-kitap-bilgi">
                        <h4>Devlet Ana</h4>
                        <p>Kemal Tahir</p>
                        <div class="yildizlar">★★★★☆</div>
                    </div>
                </div>

                <div class="profil-kitap">
                    <img src="https://via.placeholder.com/60x90?text=K" alt="Kitap">
                    <div class="profil-kitap-bilgi">
                        <h4>İnce Memed</h4>
                        <p>Yaşar Kemal</p>
                        <div class="yildizlar">★★★★★</div>
                    </div>
                </div>

                <div class="profil-kitap">
                    <img src="https://via.placeholder.com/60x90?text=K" alt="Kitap">
                    <div class="profil-kitap-bilgi">
                        <h4>Saatleri Ayarlama Enstitüsü</h4>
                        <p>Ahmet Hamdi Tanpınar</p>
                        <div class="yildizlar">★★★★☆</div>
                    </div>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
