<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - KitapSkor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">KitapSkor</div>
        <div class="nav-search">
            <input type="text" placeholder="Kitap, yazar veya ISBN ara...">
            <button>Ara</button>
        </div>
        <div class="nav-links">
            <a href="giris.html">Giriş Yap</a>
            <a href="kayit.html">Üye Ol</a>
        </div>
    </nav>

    <!-- GİRİŞ FORMU -->
    <div class="auth-container">
        <div class="auth-box">
            <h2>Giriş Yap</h2>
            <p class="auth-alt">Üye değil misin? <a href="kayit.html">Üye Ol</a></p>

            <div class="form-group">
                <label>E-posta</label>
                <input type="email" placeholder="ornek@email.com">
            </div>

            <div class="form-group">
                <label>Şifre</label>
                <input type="password" placeholder="Şifreniz">
            </div>

            <button class="auth-btn">Giriş Yap</button>

            <p class="auth-alt" style="margin-top: 16px;">
                <a href="#">Şifremi Unuttum</a>
            </p>
        </div>
    </div>

</body>
</html>
